<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Odyssey · 词汇漫游</title>
<style>
:root{--bg:#121a24;--pn:#1b2531;--pn2:#263344;--tx:#ece4d2;--mu:#93a5b7;--br:#c9a24d;--gr:#5aa987;--glow:.3;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px 6px}
.gate{color:var(--br);filter:drop-shadow(0 0 calc(var(--glow)*12px) var(--br));transition:filter 1.5s}
.gate path:last-child{opacity:var(--glow);transition:opacity 1.5s}
.ttl{flex:1}
.ttl b{font:600 1.25rem Georgia,"Songti SC",serif;letter-spacing:.02em}
.ttl small{display:block;color:var(--mu);font-size:.8rem}
.hud{text-align:right;font-size:.85rem;color:var(--br);min-width:64px}
.xp{height:3px;background:var(--pn2);margin-top:4px;border-radius:2px}
.xp i{display:block;height:100%;width:0;background:var(--br);border-radius:2px;transition:width .5s}
nav{display:flex;gap:8px;padding:4px 16px 8px;border-bottom:1px solid var(--pn2)}
nav button{background:none;border:1px solid var(--pn2);border-radius:999px;padding:2px 14px;font-size:.85rem;color:var(--mu)}
#log{flex:1;overflow-y:auto;padding:16px;font-family:Georgia,"Iowan Old Style","Songti SC","Noto Serif SC",serif;font-size:1.05rem;line-height:1.7}
.ln{margin:0 0 16px;max-width:94%}
.ln b{display:block;font:600 .8rem system-ui,sans-serif;margin-bottom:2px}
.n p:first-child{color:var(--mu);font-style:italic}
.s{padding-left:12px;border-left:3px solid var(--mu)}
.s.mara{border-color:var(--gr)}.s.mara b{color:var(--gr)}
.y{margin-left:auto;text-align:right;padding-right:12px;border-right:3px solid var(--br)}.y b{color:var(--br)}
.zh{font:.9rem/1.5 system-ui,"PingFang SC",sans-serif;color:#9db6cb;margin-top:2px}
.ph{margin:24px 0 14px;padding-top:10px;border-top:1px solid var(--pn2);font:.85rem system-ui,sans-serif;color:var(--br)}
.wd{color:var(--br);border-bottom:1px dashed var(--br);cursor:pointer}
footer{background:var(--pn);border-top:1px solid var(--pn2);padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-height:60dvh;overflow-y:auto}
footer p{margin-bottom:8px}
.ctx{color:var(--mu);font-size:.9rem}
.q{font-size:1.05rem}
.hint{color:var(--mu);font-size:.88rem}
.fb{min-height:1.5em}
.row{display:flex;gap:8px;margin-top:8px}
.row button,.pri,.ghost{padding:9px 16px;border-radius:10px;border:1px solid var(--pn2);background:none}
.row .pri,.pri{background:var(--br);border-color:var(--br);color:#1a1405;font-weight:600}
.row button:last-child:not(.ghost){flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--pn2);border:1px solid transparent;border-radius:10px;padding:10px 14px;margin-bottom:8px}
.opt:disabled{opacity:.45}
.opt small{display:none;color:#9db6cb;font-size:.85rem}
.showzh .opt small{display:block}
input{width:100%;font:1.1rem system-ui,sans-serif;background:var(--bg);color:var(--tx);border:1px solid var(--mu);border-radius:10px;padding:9px 12px;margin:4px 0 8px}
input:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#1f2a38;width:100%;max-width:640px;max-height:85dvh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font:600 1.5rem Georgia,serif}.sheet h2 small{font:.9rem system-ui,sans-serif;color:var(--mu)}
.sheet p{margin:6px 0}.pos{color:var(--br);font-style:italic}.zhx{color:#9db6cb}
.sheet dl{margin:10px 0 14px;font-size:.92rem}.sheet dt{color:var(--br);margin-top:6px}.sheet dd{margin:0}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{background:var(--pn2);border:0;border-radius:10px;padding:6px 12px;font-size:.92rem}
.chip i{display:block;font-style:normal;font-size:.6rem;color:var(--br);letter-spacing:2px}
.lock{color:var(--mu);opacity:.5}
#stage{position:relative;height:clamp(96px,16dvh,132px);overflow:hidden;border-bottom:1px solid var(--pn2);background:var(--pn)}
#bg,#bg svg,#rain{position:absolute;inset:0;width:100%;height:100%}
#pt{position:absolute;right:7%;bottom:0;height:94%;aspect-ratio:5/6;opacity:0;transition:opacity .4s}
#pt svg,#pt img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,0,0,.55))}
#pt.in svg,#pt.in img{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bd{transform-origin:50px 120px;animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,1.02)}}
.hr{transform-box:fill-box;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1deg)}}
.talk .mo{transform-box:fill-box;transform-origin:center 25%;animation:talk .2s ease-in-out 7}
@keyframes talk{50%{transform:scaleY(2.2)}}
.sp{position:absolute;right:calc(7% + 36px);bottom:48px;width:6px;height:6px;background:var(--br);border-radius:50%;box-shadow:0 0 6px var(--br);animation:spk 1s ease-out forwards;pointer-events:none}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <svg class="gate" viewBox="0 0 40 48" width="34" height="40" aria-hidden="true"><path d="M6 46V20a14 14 0 0 1 28 0v26" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 46V21a8 8 0 0 1 16 0v25" fill="currentColor"/></svg>
  <div class="ttl"><b>Word Odyssey</b><small id="ph">词汇漫游 · London After Rain</small></div>
  <div class="hud"><span id="lv"></span><div class="xp"><i id="xpb"></i></div></div>
</header>
<nav><button id="bA">词汇档案</button><button id="bR">复习</button><button id="bS">氛围音 关</button><button id="bX">重置</button></nav>
<div id="stage"><div id="bg"></div><canvas id="rain"></canvas><div id="pt"></div></div>
<main id="log" aria-live="polite"></main>
<footer id="act"></footer>
<div id="modal" hidden></div>
<script>
/* ===== 词汇数据：[音标, 词性, 英文释义, 中文, 例句({}=本句用到的词形), 例句翻译, 搭配, 词形/词族] ===== */
const W={
alter:["ˈɔːltə","v.","to change something, usually in a small way","改变；篡改","Someone had {altered} the date on the ticket.","有人篡改了车票上的日期。","alter a plan / alter course","alteration n. · alterable adj. · unaltered adj."],
evidence:["ˈevɪdəns","n.","facts or signs that show something is true","证据","This ticket is our first piece of {evidence}.","这张车票是我们的第一条证据。","clear / strong evidence; evidence of / for sth","evident adj. · evidently adv."],
authentic:["ɔːˈθentɪk","adj.","real, not copied or false","真实的；正宗的","Is the stamp {authentic}, or just a copy?","这枚印章是真的，还是仿造的？","an authentic document / voice","authenticity n. · authenticate v."],
conceal:["kənˈsiːl","v.","to hide something so it cannot be seen or found","隐藏；隐瞒","Fog can {conceal} a whole street.","大雾能把整条街藏起来。","conceal the truth; conceal sth from sb","concealment n. · concealed adj."],
reveal:["rɪˈviːl","v.","to make something known or show what was hidden","揭示；透露","The old letter will {reveal} the truth.","那封旧信会揭示真相。","reveal a secret; reveal that…","revelation n. · revealing adj."],
ancient:["ˈeɪnʃənt","adj.","very old, from a time long ago","古老的；古代的","The {ancient} clock stopped at midnight.","那座古老的钟停在了午夜。","ancient history / ruins / civilisation","反义：modern adj."],
mysterious:["mɪˈstɪəriəs","adj.","strange and difficult to explain","神秘的","A {mysterious} light shone under the door.","一道神秘的光从门下透出。","a mysterious disappearance / stranger","mystery n. · mysteriously adv."],
investigate:["ɪnˈvestɪɡeɪt","v.","to try to find out the facts about something","调查","We must {investigate} who changed the records.","我们必须调查是谁改了记录。","investigate a crime / a claim / a case","investigation n. · investigator n."],
crucial:["ˈkruːʃl","adj.","extremely important for success or a result","至关重要的","It is {crucial} to read every date carefully.","仔细读每个日期至关重要。","crucial to / for sth; a crucial role","crucially adv."],
suspicious:["səˈspɪʃəs","adj.","feeling or showing that you do not trust someone or something","可疑的；怀疑的","The clerk gave us a {suspicious} look.","职员用怀疑的眼神看了我们一眼。","suspicious of sb; a suspicious package","suspicion n. · suspect v./n. · suspiciously adv."],
archive:["ˈɑːkaɪv","n.","a place where historical records are kept","档案馆；档案","Old newspapers are kept in the {archive}.","旧报纸都保存在档案馆里。","a digital archive; in the archives","archivist n. · archive v."],
consequence:["ˈkɒnsɪkwəns","n.","a result of an action, often a bad one","后果；结果","Every change has a {consequence}.","每一次改变都有后果。","as a consequence of; serious consequences","consequent adj. · consequently adv."],
hesitate:["ˈhezɪteɪt","v.","to pause before doing something because you are unsure","犹豫","Don't {hesitate} to ask for help.","需要帮助尽管开口。","hesitate to do sth; without hesitation","hesitation n. · hesitant adj. · hesitantly adv."],
witness:["ˈwɪtnəs","n./v.","a person who sees an event; to see it happen","目击者；目睹","A {witness} saw the man leave the station.","一名目击者看到那人离开了车站。","an eye witness; witness a crime","名词、动词同形"],
fragile:["ˈfrædʒaɪl","adj.","easily broken or damaged","易碎的；脆弱的","The paper was old and {fragile}.","那张纸又旧又脆。","a fragile peace; handle with care","fragility n."],
reluctant:["rɪˈlʌktənt","adj.","not willing to do something","不情愿的","She was {reluctant} to open the box.","她不情愿打开那个盒子。","reluctant to do sth","reluctance n. · reluctantly adv."],
glimpse:["ɡlɪmps","n./v.","a quick look; to see for a moment","一瞥；瞥见","I caught a {glimpse} of a green coat.","我瞥见了一件绿色外套。","catch a glimpse of sth","名词、动词同形"],
vanish:["ˈvænɪʃ","v.","to disappear suddenly or completely","消失","The street signs began to {vanish} one by one.","路牌一个接一个消失了。","vanish into thin air; vanish without a trace","vanishing adj. · vanished adj."],
convince:["kənˈvɪns","v.","to make someone believe something is true","说服；使确信","Can you {convince} him to tell the truth?","你能说服他说出真相吗？","convince sb of sth / to do sth","convincing adj. · convinced adj. · conviction n."],
restore:["rɪˈstɔː","v.","to bring something back to its original condition","恢复；修复","They will {restore} the missing pages.","他们会修复缺失的书页。","restore order / confidence / a painting","restoration n. · restored adj."]
};
/* ===== 剧情：n=旁白 s=对话 c=选择 q=解谜(mc选词/fill填词形/spell拼写) ===== */
const PH=["第一阶段 · 寻找神秘车票","第二阶段 · 调查被修改的历史记录","第三阶段 · 进入隐藏档案馆"];
const S=[
{ph:0,t:"n",en:"The rain has just stopped. Platform 9 of an old London station smells of wet iron.",zh:"雨刚停。伦敦一座老车站的九号站台弥漫着湿铁的气味。"},
{t:"n",en:"At the end of the platform, a brass gate glows in the wall. It looks [ancient] and [mysterious].",zh:"站台尽头的墙上，一扇黄铜色的门散发着微光。它看起来古老而神秘。"},
{t:"s",w:"Mara",en:"Don't stare at it. Someone is trying to [alter] this city's history.",zh:"别盯着它看。有人想篡改这座城市的历史。"},
{t:"c",q:"How do you reply?",o:[
 {en:"Who are you?",zh:"你是谁？",r:{w:"Mara",en:"Mara. I wear green so the rain can find me. Now, look at the bench behind you.",zh:"玛拉。我穿绿色，这样雨才找得到我。现在看看你身后的长椅。"}},
 {en:"Is this a joke?",zh:"这是玩笑吗？",r:{w:"Mara",en:"I wish it were. Look at the bench behind you.",zh:"我也希望是。看看你身后的长椅。"}}]},
{t:"n",en:"A paper ticket lies on the bench. You pick it up. The date on it looks [suspicious].",zh:"长椅上放着一张纸质车票。你拿起它，上面的日期看上去很可疑。"},
{t:"s",w:"Mara",en:"This ticket is our first piece of [evidence]. But is it [authentic]?",zh:"这张票是我们的第一条证据。但它是真的吗？"},
{t:"q",k:"mc",w:"suspicious",ctx:"Mara frowns at the date. Which word fits her feeling?"},
{t:"s",w:"Mara",en:"Right. The stamp says 1987, but the ink is still wet.",zh:"没错。印章写着1987年，墨迹却还没干。"},
{t:"q",k:"fill",w:"evidence",ctx:"Tell Mara what you found."},
{t:"s",w:"Mara",en:"Then it's fake. Wait! I caught a [glimpse] of someone at the gate.",zh:"那它就是假的。等等！我瞥见门边有个人。"},
{t:"q",k:"spell",w:"authentic",ctx:"The gate asks you to spell the word you doubted."},
{ph:1,t:"n",en:"The gate opens. Beyond it is a records office where every clock shows a different year.",zh:"门开了。门后是一间档案室，每座钟都显示着不同的年份。"},
{t:"n",en:"A clerk sits at the desk. He seems [reluctant] to look up.",zh:"一名职员坐在桌后，似乎不愿抬头。"},
{t:"s",w:"Clerk",en:"We are closed. There is nothing to see here.",zh:"我们不营业。这里没什么可看的。"},
{t:"c",q:"What do you say?",o:[
 {en:"A [witness] saw you change the records.",zh:"有目击者看到你改了记录。",r:{w:"Clerk",en:"A witness? Fine. The ledger is behind me. But it is [fragile].",zh:"目击者？好吧。账簿在我身后，但它很脆弱。"}},
 {en:"It is [crucial] that we see the ledger.",zh:"我们必须看一下账簿，这非常重要。",r:{w:"Clerk",en:"Crucial, hm? Fine. The ledger is behind me. But it is [fragile].",zh:"很重要，是吗？好吧。账簿在我身后，但它很脆弱。"}}]},
{t:"n",en:"In the ledger, one page is torn out. Someone tried to [conceal] a name.",zh:"账簿里有一页被撕掉了。有人想隐藏一个名字。"},
{t:"q",k:"mc",w:"conceal",ctx:"What was the torn page for?"},
{t:"s",w:"Mara",en:"Every change has a [consequence]. Look, the street signs outside begin to [vanish].",zh:"每一次改变都有后果。看，外面的路牌开始消失了。"},
{t:"q",k:"fill",w:"investigate",ctx:"Mara asks what you will do next."},
{t:"s",w:"Mara",en:"Quickly. Don't [hesitate]. The missing page is in the old archive below the station.",zh:"快。别犹豫。缺失的那页在车站下面的旧档案馆里。"},
{t:"q",k:"spell",w:"crucial",ctx:"The stairway door asks for a password."},
{ph:2,t:"n",en:"A staircase winds down into the old [archive]. Dust hangs in the lamplight.",zh:"楼梯盘旋着通向旧档案馆。灯光里漂浮着灰尘。"},
{t:"s",w:"Mara",en:"The torn page will [reveal] who changed the past. We must [restore] it before dawn.",zh:"那张残页会揭示是谁改变了过去。我们必须在天亮前修复它。"},
{t:"q",k:"fill",w:"reveal",ctx:"Read the old note aloud."},
{t:"n",en:"At the end of the hall, a man in grey holds the page. Mara whispers, 'Can you [convince] him?'",zh:"大厅尽头，一个灰衣男人拿着那页纸。玛拉低声说：“你能说服他吗？”"},
{t:"c",q:"Convince him!",o:[
 {en:"Please give it back. The city needs it.",zh:"请还给我们。这座城市需要它。",r:{w:"Grey Man",en:"You are right. I was only afraid of losing one thing.",zh:"你说得对。我只是害怕失去一样东西。"}},
 {en:"Give it back, or we call the police.",zh:"还回来，否则我们报警。",r:{w:"Grey Man",en:"No need. I was only afraid of losing one thing.",zh:"不必。我只是害怕失去一样东西。"}}]},
{t:"q",k:"mc",w:"convince",ctx:"Which word describes what you just did?"},
{t:"q",k:"fill",w:"restore",ctx:"Mara places the page on the desk."},
{t:"n",en:"The date on the ticket changes back to 1987. Then the brass gate hums and opens at last.",zh:"车票上的日期变回了1987年。随后，黄铜之门嗡鸣着，终于完全打开。"},
{t:"s",w:"Mara",en:"You did it. Keep the ticket. It will lead us to the next world.",zh:"你做到了。留着这张票，它会带我们去下一个世界。"},
{t:"end"}
];
/* ===== 状态与存档 ===== */
const $=s=>document.querySelector(s),log=$("#log"),A=$("#act"),modal=$("#modal"),KEY="wordOdyssey.v1";
const IV=[0,6e5,864e5,2592e5,6048e5];
let st={pos:0,xp:0,w:{}},cur=[],back=()=>{};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const sh=a=>[...a].sort(()=>Math.random()-.5);
const ws=id=>st.w[id]||(st.w[id]={lv:0,due:0,done:0});
const rich=t=>t.replace(/\[([^\]|]+)(?:\|([^\]]+))?\]/g,(m,a,b)=>`<span class="wd" data-w="${(b||a).toLowerCase()}">${a}</span>`);
function hud(){
  $("#lv").textContent="Lv."+(Math.floor(st.xp/100)+1);$("#xpb").style.width=st.xp%100+"%";
  const n=Object.keys(st.w).filter(i=>st.w[i].done&&st.w[i].due<=Date.now()).length;
  $("#bR").textContent="复习"+(n?` (${n})`:"");
}
function setPhase(p){$("#ph").textContent=PH[p];document.documentElement.style.setProperty("--glow",[.3,.6,.95][p]);scene(p)}
function grade(id,t){const s=ws(id);if(t==0)s.lv=Math.min(4,s.lv+1);s.due=Date.now()+IV[s.lv];st.xp+=[10,5,0][t];save();hud()}
/* ===== 界面辅助 ===== */
function btns(list){const r=document.createElement("div");r.className="row";list.forEach(([l,f,c])=>{const b=document.createElement("button");b.textContent=l;if(c)b.className=c;b.onclick=f;r.append(b)});A.append(r)}
function showAct(f){back=f;f()}
function add(cls,who,html,zh){
  const d=document.createElement("div");d.className="ln "+cls;
  d.innerHTML=(who?`<b>${who}</b>`:"")+`<p>${html}</p>`+(zh?`<p class="zh" hidden>${zh}</p>`:"");
  log.append(d);log.scrollTop=log.scrollHeight;
  d.querySelectorAll(".wd").forEach(x=>W[x.dataset.w]&&ws(x.dataset.w));
  return d;
}
function card(id,cb){
  const w=W[id];if(!w)return;ws(id).done=1;save();hud();
  modal.innerHTML=`<div class="sheet"><h2>${id} <small>/${w[0]}/</small></h2><p class="pos">${w[1]}</p><p>${w[2]}</p><p class="zhx">${w[3]}</p>
  <p>${w[4].replace(/\{(.+?)\}/,"<b class='wd'>$1</b>")}</p><p class="zhx">${w[5]}</p>
  <dl><dt>常见搭配</dt><dd>${w[6]}</dd><dt>词形变化 / 词族</dt><dd>${w[7]}</dd></dl>
  <button class="pri" id="cx">${cb?"开始挑战":"关闭"}</button></div>`;
  modal.hidden=false;modal.onclick=e=>{if(e.target==modal&&!cb)modal.hidden=true};
  $("#cx").onclick=()=>{modal.hidden=true;cb&&cb()};
}
function archive(){
  const ids=Object.keys(W),seen=ids.filter(i=>st.w[i]),got=seen.filter(i=>st.w[i].lv>=3).length;
  modal.innerHTML=`<div class="sheet"><h2>词汇档案</h2><p class="hint">已收集 ${seen.length}/${ids.length} · 已掌握 ${got}（点单词查看词卡）</p><div class="grid">`+
  ids.map(i=>st.w[i]?`<button class="chip" data-w="${i}">${i}<i>${"●".repeat(st.w[i].lv)+"○".repeat(4-st.w[i].lv)}</i></button>`:`<span class="chip lock">？？？</span>`).join("")+
  `</div><button class="pri" id="cx">关闭</button></div>`;
  modal.hidden=false;modal.onclick=e=>{const c=e.target.closest("[data-w]");if(c)card(c.dataset.w);else if(e.target==modal)modal.hidden=true};
  $("#cx").onclick=()=>modal.hidden=true;
}
A.addEventListener("click",e=>{const w=e.target.closest(".wd");if(w){e.stopPropagation();card(w.dataset.w)}},true);

/* ===== 题目：mc 词义选词 / fill 词形填空 / spell 拼写 ===== */
function drill(k,id,ctx,done,quit){
  const w=W[id],ans=k=="fill"?w[4].match(/\{(.+?)\}/)[1]:id;let tries=0,body;
  const hint=k=="mc"?"中文意思："+w[3]:"开头是 "+ans.slice(0,2)+"…";
  if(k=="mc")body=`<p class="q">${w[2]}</p>`+sh([id,...sh(Object.keys(W).filter(x=>x!=id)).slice(0,3)]).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("");
  else body=(k=="fill"?`<p class="q">${w[4].replace(/\{.+?\}/,"_____")}</p><p class="hint">用 ${id}（${w[1]}）的正确词形填空<br>${w[5]}</p>`:`<p class="q">${w[3]}　${w[1]}</p><p class="hint">${id[0]+" _".repeat(id.length-1)}</p>`)+`<input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"><button class="pri" id="ck">检查</button>`;
  A.innerHTML=(ctx?`<p class="ctx">${ctx}</p>`:"")+body+`<p class="fb"></p>`;
  const fb=A.querySelector(".fb"),lock=()=>A.querySelectorAll(".opt,#in,#ck").forEach(e=>e.disabled=true);
  const fin=t=>{lock();grade(id,t);react(t<2?"smile":"ask");
    fb.innerHTML=t==0?"✓ 正确 +10 XP":t==1?"✓ 正确 +5 XP":`答案：<b>${ans}</b>（没关系，它会在复习里再出现）`;
    btns([["词卡",()=>card(id),"ghost"],["继续 ▸",done,"pri"]])};
  const check=v=>{if(v.trim().toLowerCase()==ans.toLowerCase())fin(tries?1:0);else if(++tries>=2)fin(2);else fb.textContent="还差一点。提示："+hint};
  A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.dataset.o==id?check(id):(b.disabled=true,check(b.dataset.o))});
  const inp=$("#in");if(inp){$("#ck").onclick=()=>check(inp.value);inp.onkeydown=e=>{if(e.key=="Enter"&&!inp.disabled)check(inp.value)};setTimeout(()=>inp.focus(),50)}
  if(quit)btns([["退出复习",quit,"ghost"]]);
}
/* ===== 复习：未学过的不出现；答对升级，间隔逐步拉长 ===== */
function review(all){
  const now=Date.now(),q=sh(Object.keys(st.w).filter(i=>W[i]&&st.w[i].done&&(all||st.w[i].due<=now))).slice(0,8);
  if(!q.length){
    A.innerHTML=`<p class="ctx">现在没有到期的单词。</p>`;
    if(Object.keys(st.w).some(i=>st.w[i].done))btns([["提前练习已学单词",()=>review(1),"pri"]]);
    btns([["回到剧情",back,"ghost"]]);return;
  }
  let i=0;const step=()=>{
    if(i>=q.length){A.innerHTML=`<p class="q">复习完成 ✓</p>`;btns([["回到剧情",back,"pri"]]);return}
    const id=q[i],lv=st.w[id].lv,k=lv==0?"mc":lv==1?"fill":lv==2?"spell":["fill","spell"][Math.random()*2|0];
    drill(k,id,`复习 ${i+1}/${q.length}`,()=>{i++;step()},back);
  };step();
}

  const mouth=e=="smile"?`<path d="M41 66q9 11 18 0z" fill="#8e3b3b" stroke="#6b2a2a" stroke-width="1.2" stroke-linejoin="round"/><path d="M44 68q6 3 12 0" stroke="#e58a8a" stroke-width="1.5" fill="none"/>`:e=="surprise"?`<ellipse cx="50" cy="69" rx="4" ry="5" fill="#7a2f2f"/>`:e=="ask"?`<path d="M43 69q7-3 14 1q-7 2-14-1z" fill="#a0524a"/>`:`<path d="M44 68q6 2.4 12 0q-6 3.6-12 0z" fill="#a0524a"/>`;

  clerk:e=>`<defs>${SKIN}<linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66707c"/><stop offset="1" stop-color="#434b56"/></linearGradient></defs><g class="bd"><path d="M6 120q0-27 36-33l8 12 8-12q36 6 36 33z" fill="url(#vg)"/><path d="M42 87l8 33 8-33z" fill="#efe9da"/><path d="M47 94h6l2 8-5 14-5-14z" fill="#8e3b3b"/><path d="M34 120q4-16 16-10" stroke="#c9a24d" stroke-width="1.4" fill="none"/><circle cx="34" cy="120" r="2.4" fill="#c9a24d"/>${HEAD}<path d="M26 50q-3-9 0-16q5 2 5 16zM74 50q3-9 0-16q-5 2-5 16z" fill="#bdbdb8"/><path d="M36 30q14-8 28 0" stroke="#bdbdb8" stroke-width="2" fill="none" stroke-linecap="round"/>${face(e,"#5a4030","#8d8d88")}<path d="M38 36q12-3 24 0" stroke="#d0a888" stroke-width="1" fill="none"/><g fill="rgba(200,230,255,.14)" stroke="#33363b" stroke-width="2"><circle cx="40" cy="52" r="9"/><circle cx="60" cy="52" r="9"/></g><path d="M49 52h2M31 51l-5-2M69 51l5-2" stroke="#33363b" stroke-width="2"/><path d="M34 48q3-4 7-4" stroke="#fff" opacity=".6" stroke-width="1.4" fill="none"/><path d="M40 62q10-4 20 0q-3 4-10 2q-7 2-10-2z" fill="#9a9a95"/></g>`,
  grey:e=>`<defs>${SKIN}<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f8892"/><stop offset="1" stop-color="#4c535b"/></linearGradient></defs><g class="bd"><path d="M4 120q0-30 40-34h12q40 4 40 34z" fill="url(#tg)"/><path d="M28 84l-14 24 22 10 12-20zM72 84l14 24-22 10-12-20z" fill="#5c646d"/><path d="M42 88l8 20 8-20z" fill="#d8d2c2"/>${HEAD}<path d="M34 68q16 14 32 0v6q-16 12-32 0z" fill="#3a3a3a" opacity=".2"/>${face(e,"#46505a","#2a2a2a")}<path d="M27 44q23 9 46 0v8q-23 9-46 0z" fill="#000" opacity=".22"/><g transform="translate(0,-7)"><path d="M27 38q0-20 23-20t23 20z" fill="#3b4048"/><path d="M27 33h46v5H27z" fill="#8a6d3c"/><path d="M12 40q38 11 76 0l-3 5q-35 9-70 0z" fill="#2c3036"/></g></g>`

function svgPt(k,e){const t=document.createElement("template");t.innerHTML=`<svg viewBox="0 0 100 120">${ART[k](e)}</svg>`;return t.content.firstChild}
function draw(who,e,anim){
  const k=SK[who],box=$("#pt");box.innerHTML="";
  if(noImg[k])box.append(svgPt(k,e));
  else box.innerHTML=`<img alt="" src="img/${k}_${e}.png" onerror="noImg['${k}']=1;this.replaceWith(svgPt('${k}','${e}'))">`;
  box.style.opacity=1;if(anim){box.classList.remove("in");void box.offsetWidth;box.classList.add("in");box.classList.remove("talk");void box.offsetWidth;box.classList.add("talk")}
}
function speak(who,en){
  lastWho=SK[who]?who:null;if(!lastWho){$("#pt").style.opacity=0;return}
  draw(who,/!/.test(en)?"surprise":/\?/.test(en)?"ask":/You did it|Right\.|Good/.test(en)?"smile":"neutral",1);
}
const react=e=>{lastWho&&draw(lastWho,e,0);e=="smile"&&sparkle()};
function sparkle(){const st=$("#stage");for(let i=0;i<9;i++){const d=document.createElement("i");d.className="sp";d.style.cssText=`--dx:${Math.random()*90-45}px;--dy:${-30-Math.random()*50}px;animation-delay:${i*40}ms`;st.append(d);setTimeout(()=>d.remove(),1300)}}
const BG=[
 `<svg viewBox="0 0 400 132" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1722"/><stop offset="1" stop-color="#27384a"/></linearGradient></defs><rect width="400" height="132" fill="url(#g0)"/><path d="M0 104h400v28H0z" fill="#161e29"/><path d="M0 112h400M0 122h400" stroke="#3a4b5e" stroke-width="1.5"/><circle cx="70" cy="40" r="30" fill="#c9a24d" opacity=".12"/><circle cx="70" cy="40" r="5" fill="#c9a24d"/><rect x="69" y="45" width="2" height="60" fill="#c9a24d"/><path d="M60 104V62a28 28 0 0 1 56 0v42z" transform="translate(150 0)" fill="#c9a24d" fill-opacity=".3" stroke="#c9a24d" stroke-width="2"/></svg>`,
 `<svg viewBox="0 0 400 132" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2118"/><stop offset="1" stop-color="#40301f"/></linearGradient></defs><rect width="400" height="132" fill="url(#g1)"/><rect x="0" y="108" width="400" height="24" fill="#1d160f"/><g fill="#e9d9b0" fill-opacity=".85" stroke="#7a5b2e" stroke-width="3"><circle cx="50" cy="42" r="16"/><circle cx="110" cy="62" r="12"/><circle cx="170" cy="34" r="14"/><circle cx="240" cy="58" r="11"/></g><g stroke="#3b2a17" stroke-width="2"><path d="M50 42v-9M50 42l6 3M110 62v-7M110 62l5-2M170 34v-8M170 34l7 2M240 58v-6M240 58l4 3"/></g></svg>`,

/* 雨：第一阶段显示；氛围音：雨声 → 室内低沉环境声 */
const cv=$("#rain"),cx=cv.getContext("2d"),calm=matchMedia("(prefers-reduced-motion:reduce)").matches;let drops=[],raining=false,ac,gn,fl;
function rainLoop(){
  if(!raining){cx.clearRect(0,0,cv.width,cv.height);return}
  cx.clearRect(0,0,cv.width,cv.height);cx.strokeStyle="rgba(170,200,230,.35)";cx.beginPath();
  drops.forEach(d=>{cx.moveTo(d.x,d.y);cx.lineTo(d.x-d.l*.2,d.y+d.l);d.y+=d.v;if(d.y>cv.height){d.y=-20;d.x=Math.random()*cv.width}});
  cx.stroke();requestAnimationFrame(rainLoop)}
function rain(on){
  if(on==raining||calm&&on)return;raining=on;
  if(on){cv.width=cv.clientWidth;cv.height=cv.clientHeight;drops=Array.from({length:40},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,l:8+Math.random()*10,v:5+Math.random()*4}));rainLoop()}}
function mood(){if(!ac)return;fl.frequency.value=PHN==0?1800:280;gn.gain.setTargetAtTime(ambOn?(PHN==0?.06:.1):0,ac.currentTime,.4)}
function scene(p){PHN=p;$("#bg").innerHTML=BG[p];rain(p==0);mood()}
$("#bS").onclick=()=>{
  ambOn=!ambOn;$("#bS").textContent="氛围音 "+(ambOn?"开":"关");
  try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=ac.createBufferSource();n.buffer=b;n.loop=true;fl=ac.createBiquadFilter();fl.type="bandpass";gn=ac.createGain();gn.gain.value=0;n.connect(fl);fl.connect(gn);gn.connect(ac.destination);n.start()}ac.resume();mood()}catch(e){}
};
/* ===== 剧情引擎 ===== */
const next=()=>{st.pos++;run()};
function run(){
  const b=S[st.pos];save();hud();
  if(b.ph!=null){setPhase(b.ph);log.insertAdjacentHTML("beforeend",`<div class="ph">${PH[b.ph]}</div>`)}
  if(b.t=="n"||b.t=="s"){
    const d=add(b.t=="s"?"s "+(b.w=="Mara"?"mara":""):"n",b.t=="s"?b.w:"",rich(b.en),b.zh);cur=[d.querySelector(".zh")];speak(b.t=="s"?b.w:null,b.en);
    showAct(()=>{A.innerHTML="";btns([["中文提示",e=>{cur.forEach(z=>z&&(z.hidden=false));e.target.disabled=true},"ghost"],["继续 ▸",next,"pri"]])});
  }else if(b.t=="c")showAct(()=>{
    A.className="";A.innerHTML=`<p class="ctx">${b.q}</p>`+b.o.map((o,i)=>`<button class="opt" data-i="${i}">${rich(o.en)}<small>${o.zh}</small></button>`).join("");
    btns([["中文提示",()=>A.classList.add("showzh"),"ghost"]]);
    A.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{
      const o=b.o[x.dataset.i];A.classList.remove("showzh");
      const a=add("y","You",rich(o.en),o.zh),r=add("s "+(o.r.w=="Mara"?"mara":""),o.r.w,rich(o.r.en),o.r.zh);
      cur=[a.querySelector(".zh"),r.querySelector(".zh")];speak(o.r.w,o.r.en);
      A.innerHTML="";btns([["中文提示",e=>{cur.forEach(z=>z.hidden=false);e.target.disabled=true},"ghost"],["继续 ▸",next,"pri"]]);back=()=>{A.innerHTML="";btns([["继续 ▸",next,"pri"]])};
    });
  });
  else if(b.t=="q")showAct(()=>{const go=()=>drill(b.k,b.w,b.ctx,next);ws(b.w).done?go():card(b.w,go)});
  else showAct(()=>{
    const n=Object.keys(st.w).length;
    A.innerHTML=`<p class="q">第一章完 · To be continued…</p><p class="hint">收集 ${n}/${Object.keys(W).length} 个单词，累计 ${st.xp} XP。</p>`;
    btns([["复习词汇",()=>review(1),"pri"],["重玩第一章",()=>{st.pos=0;save();log.innerHTML="";run()},"ghost"]]);
  });
}
$("#bA").onclick=archive;$("#bR").onclick=()=>review();
$("#bX").onclick=()=>{if(confirm("清除所有学习进度并重新开始？")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
(function init(){
  if(st.pos<0||st.pos>=S.length)st.pos=0;
  let p=0;for(let i=0;i<=st.pos;i++)if(S[i].ph!=null)p=S[i].ph;setPhase(p);
